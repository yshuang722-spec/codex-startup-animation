<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>Codex Startup Mac</title>
  <style>html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}canvas{display:block;width:100%;height:100%}canvas:focus{outline:none}#skip{position:fixed;right:14px;top:12px;padding:7px 12px;border:1px solid rgba(87,255,169,.4);border-radius:8px;background:rgba(2,18,14,.9);color:#b8f6d2;font:12px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;cursor:pointer}#skip:hover{background:#143b2a;color:#fff}#skip:focus-visible{outline:2px solid #57ffa9;outline-offset:3px}html.finished #skip{display:none}</style>
  <style>#skip{box-sizing:border-box;width:84px;height:31px}.native-controls #skip{visibility:hidden}#drag-hint{display:none;position:fixed;top:18px;left:50%;transform:translateX(-50%);color:rgba(160,211,187,.7);font:11px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;pointer-events:none;white-space:nowrap}.native-controls #drag-hint{display:block}html.finished #drag-hint{display:none}</style>
</head>
<body><canvas id="stage" role="img" aria-label="Codex 启动装饰动画，可点击跳过动画"></canvas><span id="drag-hint">拖动顶部可移动窗口</span><button id="skip" type="button">跳过动画</button><script src="logo.js"></script><script src="animation.js"></script></body>
</html>
